<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniHub Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Material 3 Dark Theme Tokens (Green/Neutral vibe for Success) */
            --md-sys-color-background: #111411;
            --md-sys-color-surface-container: #282B28; /* Dark grayish green container */
            --md-sys-color-primary: #8CD69A; /* M3 soft green */
            --md-sys-color-on-primary: #003914;
            --md-sys-color-on-surface: #E2E3DE;
            --md-sys-color-on-surface-variant: #C2C8C1;
            --md-sys-color-outline: #8C938C;
        }

        body {
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-surface);
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        /* M3 Card Style */
        .card {
            background-color: var(--md-sys-color-surface-container);
            border-radius: 28px; /* M3 Large Corner */
            padding: 48px 32px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 4px 8px 3px rgba(0, 0, 0, 0.15),
                        0 1px 3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeIn 0.6s cubic-bezier(0.2, 0.0, 0, 1.0);
        }

        /* Success Icon */
        .icon-container {
            width: 80px;
            height: 80px;
            background-color: rgba(140, 214, 154, 0.1); /* Primary with opacity */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--md-sys-color-primary);
            margin-bottom: 8px;
        }

        svg {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }

        /* Typography */
        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 500; /* M3 Headline Small */
            line-height: 32px;
            color: var(--md-sys-color-on-surface);
        }

        p {
            margin: 0;
            font-size: 14px;
            line-height: 20px; /* M3 Body Medium */
            letter-spacing: 0.25px;
            color: var(--md-sys-color-on-surface-variant);
        }

        /* M3 Button (Filled) */
        .btn {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            font-size: 14px;
            font-weight: 500; /* Label Large */
            letter-spacing: 0.1px;
            height: 40px;
            border-radius: 20px; /* Pill shape */
            padding: 0 24px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: box-shadow 0.2s, background-color 0.2s;
        }

        .btn:hover {
            box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 3px 1px rgba(0,0,0,0.15);
            filter: brightness(1.05); /* Slight brighten on hover */
        }

        .btn:active {
            filter: brightness(0.95);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-container">
            <svg viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
        </div>

        <div>
            <h1>登入成功</h1>
            <h1 style="font-size: 18px; margin-top: 4px; opacity: 0.8;">Login Successful</h1>
        </div>

        <p>驗證已完成，您可以安全地關閉此視窗並回到 OmniHub App 開始使用。</p>

        <a href="javascript:window.close()" class="btn">
            關閉視窗 Close Window
        </a>
    </div>

    <script>
        // Try to close automatically
        setTimeout(function() {
            window.close();
        }, 1500);
    </script>
</body>
</html>
