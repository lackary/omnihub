name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - '.releaserc.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/deploy_auth_web.yml'
      - 'run_act_safe.sh'
      - 'site/**'
      - 'docs/**'
      - 'renovate.json'

  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - '.releaserc.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/deploy_auth_web.yml'
      - 'run_act_safe.sh'
      - 'site/**'
      - 'docs/**'
      - 'renovate.json'

  workflow_dispatch:
    inputs:
      enable_kotlin_daemon:
        description: 'Enable Kotlin/Native Daemon for build'
        type: boolean
        required: false
        default: false
      run_with_stacktrace:
        description: 'Run Gradle with --stacktrace'
        type: boolean
        required: false
        default: false
      run_with_info:
        description: 'Run Gradle with --info'
        type: boolean
        required: false
        default: false
      run_with_debug:
        description: 'Run Gradle with --debug'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true"
  FORCE_COMPOSITE_BUILD: "true"

jobs:
  test:
    name: Run KMP Unit Tests
    runs-on: ubuntu-latest
    env:
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      GOOGLE_SERVICES_WEB_CLIENT_ID: ${{ secrets.GOOGLE_SERVICES_WEB_CLIENT_ID }}
      FIREBASE_WEB_BASE64: ${{ secrets.FIREBASE_WEB_BASE64 }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_REGION: ${{ secrets.FIREBASE_REGION }}
      FIREBASE_EXT_CUSTOM_AUTH_PATH: ${{ secrets.FIREBASE_EXT_CUSTOM_AUTH_PATH }}
      AUTH_ENCRYPTION_SALT: ${{ secrets.AUTH_ENCRYPTION_SALT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
      ANDROID_PREFS_ROOT: ""

    steps:
      - name: Checkout OmniHub (App)
        uses: actions/checkout@v7

      - name: Checkout OmniFeed (Lib)
        uses: actions/checkout@v7
        with:
          repository: lackary/omnifeed-kmp
          path: omnifeed-kmp

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          firebase-android-base64: ${{ secrets.FIREBASE_ANDROID_BASE64 }}
          firebase-ios-base64: ${{ secrets.FIREBASE_IOS_BASE64 }}
          google-client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google-reversed-client-id: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}

      - name: Run KMP Unit Tests
        run: |
          unset ANDROID_PREFS_ROOT
          export ANDROID_USER_HOME="$HOME/.android"
          ./gradlew check \
              -Dorg.gradle.vfs.watch=false \
              -Pskip.tests=false \
              -Pskip.native.tests=true \
              -Pskip.lint=false \
              ${{ inputs.run_with_stacktrace && '--stacktrace' || '' }} \
              ${{ inputs.run_with_info && '--info' || '' }} \
              ${{ inputs.run_with_debug && '--debug' || '' }} \
              ${{ inputs.enable_kotlin_daemon && '-Pkotlin.native.enableDaemon=true' || '' }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'
          check_name: 'JUnit Test Report'
          detailed_summary: true
          include_passed: true
          annotate_only: ${{ env.ACT == 'true' }}

      - name: Upload Test Report HTML
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-html
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 5
          if-no-files-found: ignore

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: test
    env:
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      GOOGLE_SERVICES_WEB_CLIENT_ID: ${{ secrets.GOOGLE_SERVICES_WEB_CLIENT_ID }}
      FIREBASE_WEB_BASE64: ${{ secrets.FIREBASE_WEB_BASE64 }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_REGION: ${{ secrets.FIREBASE_REGION }}
      FIREBASE_EXT_CUSTOM_AUTH_PATH: ${{ secrets.FIREBASE_EXT_CUSTOM_AUTH_PATH }}
      AUTH_ENCRYPTION_SALT: ${{ secrets.AUTH_ENCRYPTION_SALT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
      ANDROID_PREFS_ROOT: ""

    steps:
      - name: Checkout OmniHub (App)
        uses: actions/checkout@v7

      - name: Checkout OmniFeed (Lib)
        uses: actions/checkout@v7
        with:
          repository: lackary/omnifeed-kmp
          path: omnifeed-kmp

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          firebase-android-base64: ${{ secrets.FIREBASE_ANDROID_BASE64 }}
          google-client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google-reversed-client-id: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}

      - name: Build Android App
        run: |
          unset ANDROID_PREFS_ROOT
          export ANDROID_USER_HOME="$HOME/.android"
          ./gradlew :androidApp:assembleDebug \
              -Dorg.gradle.vfs.watch=false \
              ${{ inputs.run_with_stacktrace && '--stacktrace' || '' }} \
              ${{ inputs.run_with_info && '--info' || '' }} \
              ${{ inputs.run_with_debug && '--debug' || '' }} \
              ${{ inputs.enable_kotlin_daemon && '-Pkotlin.native.enableDaemon=true' || '' }}

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: test
    env:
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      GOOGLE_SERVICES_WEB_CLIENT_ID: ${{ secrets.GOOGLE_SERVICES_WEB_CLIENT_ID }}
      FIREBASE_WEB_BASE64: ${{ secrets.FIREBASE_WEB_BASE64 }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_REGION: ${{ secrets.FIREBASE_REGION }}
      FIREBASE_EXT_CUSTOM_AUTH_PATH: ${{ secrets.FIREBASE_EXT_CUSTOM_AUTH_PATH }}
      AUTH_ENCRYPTION_SALT: ${{ secrets.AUTH_ENCRYPTION_SALT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
      ANDROID_PREFS_ROOT: ""

    steps:
      - name: Checkout OmniHub (App)
        uses: actions/checkout@v7

      - name: Checkout OmniFeed (Lib)
        uses: actions/checkout@v7
        with:
          repository: lackary/omnifeed-kmp
          path: omnifeed-kmp

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build Web App
        run: |
          unset ANDROID_PREFS_ROOT
          ./gradlew :webApp:compileKotlinWasmJs :webApp:wasmJsDevelopmentExecutableCompileSync \
              -Dorg.gradle.vfs.watch=false \
              ${{ inputs.run_with_stacktrace && '--stacktrace' || '' }} \
              ${{ inputs.run_with_info && '--info' || '' }} \
              ${{ inputs.run_with_debug && '--debug' || '' }} \
              ${{ inputs.enable_kotlin_daemon && '-Pkotlin.native.enableDaemon=true' || '' }}

  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux
            os: ubuntu-latest
            task: :desktopApp:packageDeb
            artifact-name: desktop-linux-deb
            artifact-path: desktopApp/build/compose/binaries/main/deb/*.deb
          - target: macOS
            os: macos-latest
            task: :desktopApp:packageDmg
            artifact-name: desktop-macos-dmg
            artifact-path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          - target: Windows
            os: windows-latest
            task: :desktopApp:packageMsi
            artifact-name: desktop-windows-msi
            artifact-path: desktopApp/build/compose/binaries/main/msi/*.msi
    env:
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      GOOGLE_SERVICES_WEB_CLIENT_ID: ${{ secrets.GOOGLE_SERVICES_WEB_CLIENT_ID }}
      FIREBASE_WEB_BASE64: ${{ secrets.FIREBASE_WEB_BASE64 }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_REGION: ${{ secrets.FIREBASE_REGION }}
      FIREBASE_EXT_CUSTOM_AUTH_PATH: ${{ secrets.FIREBASE_EXT_CUSTOM_AUTH_PATH }}
      AUTH_ENCRYPTION_SALT: ${{ secrets.AUTH_ENCRYPTION_SALT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
      ANDROID_PREFS_ROOT: ""

    steps:
      - name: Checkout OmniHub (App)
        uses: actions/checkout@v7

      - name: Checkout OmniFeed (Lib)
        uses: actions/checkout@v7
        with:
          repository: lackary/omnifeed-kmp
          path: omnifeed-kmp

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build Desktop Package
        shell: bash
        run: |
          ./gradlew ${{ matrix.task }} \
              -Dorg.gradle.vfs.watch=false \
              ${{ inputs.run_with_stacktrace && '--stacktrace' || '' }} \
              ${{ inputs.run_with_info && '--info' || '' }} \
              ${{ inputs.run_with_debug && '--debug' || '' }} \
              ${{ inputs.enable_kotlin_daemon && '-Pkotlin.native.enableDaemon=true' || '' }}

      - name: Upload Desktop Package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: ignore

  build-ios:
    name: Build iOS App
    runs-on: macos-26
    needs: test
    env:
      CHROME_BIN: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      GOOGLE_SERVICES_WEB_CLIENT_ID: ${{ secrets.GOOGLE_SERVICES_WEB_CLIENT_ID }}
      FIREBASE_WEB_BASE64: ${{ secrets.FIREBASE_WEB_BASE64 }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_REGION: ${{ secrets.FIREBASE_REGION }}
      FIREBASE_EXT_CUSTOM_AUTH_PATH: ${{ secrets.FIREBASE_EXT_CUSTOM_AUTH_PATH }}
      AUTH_ENCRYPTION_SALT: ${{ secrets.AUTH_ENCRYPTION_SALT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
      ANDROID_PREFS_ROOT: ""

    steps:
      - name: Checkout OmniHub (App)
        uses: actions/checkout@v7

      - name: Checkout OmniFeed (Lib)
        uses: actions/checkout@v7
        with:
          repository: lackary/omnifeed-kmp
          path: omnifeed-kmp

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          firebase-android-base64: ${{ secrets.FIREBASE_ANDROID_BASE64 }}
          firebase-ios-base64: ${{ secrets.FIREBASE_IOS_BASE64 }}
          google-client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google-reversed-client-id: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}

      - name: List available simulators
        run: |
          echo "=== RUNTIMES ==="
          xcrun simctl list runtimes
          echo "=== DEVICES ==="
          xcrun simctl list devices

      - name: Select an available simulator
        id: find-sim
        run: |
          set -e
          SIM=$(xcrun simctl list devices | \
            grep -E "iPhone" | \
            grep -v unavailable | \
            grep -v "(Booted)" | \
            sed -nE 's/.*\(([0-9A-F-]{36})\).*/\1/p' | \
            head -n 1)

          if [ -z "$SIM" ]; then
            echo "❌ No available iPhone simulators found"
            exit 1
          fi
          echo "✅ Selected Simulator UUID: $SIM"
          echo "SIM=$SIM" >> $GITHUB_ENV

      - name: Gradle Build & Integrate SwiftPM Package
        env:
          XCODEPROJ_PATH: iosApp/iosApp.xcodeproj
        run: |
          unset ANDROID_PREFS_ROOT
          export ANDROID_USER_HOME="$HOME/.android"
          ./gradlew :shared:integrateLinkagePackage \
              -Dorg.gradle.vfs.watch=false \
              ${{ inputs.run_with_stacktrace && '--stacktrace' || '' }} \
              ${{ inputs.run_with_info && '--info' || '' }} \
              ${{ inputs.run_with_debug && '--debug' || '' }} \
              ${{ inputs.enable_kotlin_daemon && '-Pkotlin.native.enableDaemon=true' || '' }} || true

          echo "Pre-generating synthetic SPM linkage project..."
          ACTION=build TARGET_BUILD_DIR=/tmp BUILT_PRODUCTS_DIR=/tmp CONFIGURATION=Debug SDK_NAME=iphonesimulator ARCHS=arm64 EXPANDED_CODE_SIGN_IDENTITY=- \
          ./gradlew :shared:generateSyntheticLinkageSwiftPMImportProjectForEmbedAndSignLinkage -Dorg.gradle.vfs.watch=false || true

          ACTION=build TARGET_BUILD_DIR=/tmp BUILT_PRODUCTS_DIR=/tmp CONFIGURATION=Debug SDK_NAME=iphonesimulator ARCHS=arm64 EXPANDED_CODE_SIGN_IDENTITY=- \
          ./gradlew :shared:generateSyntheticLinkageSwiftPMImportProjectForEmbedAndSignLinkage -Dorg.gradle.vfs.watch=false

          if [ -d "shared/iosApp/KotlinMultiplatformLinkedPackage" ] && [ ! -d "iosApp/KotlinMultiplatformLinkedPackage" ]; then
            echo "Syncing shared/iosApp/KotlinMultiplatformLinkedPackage to iosApp/..."
            cp -R shared/iosApp/KotlinMultiplatformLinkedPackage iosApp/
          fi

      - name: Xcode Build (clean build .xcodeproj)
        working-directory: './iosApp'
        run: |
          echo "Building iOS target via .xcodeproj..."
          xcodebuild clean build \
              -project "iosApp.xcodeproj" \
              -scheme "iosApp" \
              -configuration "Debug" \
              -sdk iphonesimulator \
              -destination "id=$SIM" \
              ENABLE_PREVIEWS=NO \
              CODE_SIGNING_ALLOWED=NO
