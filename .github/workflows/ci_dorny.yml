name: Continuous Integration (Dorny)

on:
#  push:
#    branches: [ "main" ]
#  pull_request:
#    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      run_with_stacktrace:
        description: 'Run Gradle with --stacktrace'
        type: boolean
        required: false
        default: false
      run_with_info:
        description: 'Run Gradle with --info'
        type: boolean
        required: false
        default: false
      run_with_debug:
        description: 'Run Gradle with --debug'
        type: boolean
        required: false
        default: false

jobs:
  # Job 1: Compile and test on macOS
  build-and-test:
    runs-on: macos-26
    env:
      CHROME_BIN: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      GOOGLE_SERVICES_WEB_CLIENT_ID: ${{ secrets.GOOGLE_SERVICES_WEB_CLIENT_ID }}
      FIREBASE_ANDROID_BASE64: ${{ secrets.FIREBASE_ANDROID_BASE64 }}
      FIREBASE_IOS_BASE64: ${{ secrets.FIREBASE_IOS_BASE64 }}
      FIREBASE_WEB_BASE64: ${{ secrets.FIREBASE_WEB_BASE64 }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_REGION: ${{ secrets.FIREBASE_REGION }}
      FIREBASE_EXT_CUSTOM_AUTH_PATH: ${{ secrets.FIREBASE_EXT_CUSTOM_AUTH_PATH }}
      AUTH_ENCRYPTION_SALT: ${{ secrets.AUTH_ENCRYPTION_SALT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
    steps:
      # Checkout OmniHub (App) to subdirectory 'omnihub'
      - name: Checkout OmniHub (App)
        uses: actions/checkout@v7
        with:
          path: omnihub

      # Checkout OmniFeed (Lib) to subdirectory 'omnifeed-kmp'
      - name: Checkout OmniFeed (Lib)
        uses: actions/checkout@v7
        with:
          repository: lackary/omnifeed-kmp
          path: omnifeed-kmp

      - name: Fix macOS GPG Socket Length for act
        if: ${{ env.ACT }}
        run: |
          mkdir -p /tmp/act_runner_temp
          echo "RUNNER_TEMP=/tmp/act_runner_temp" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x omnihub/gradlew

      - name: Decode Firebase Secrets (Android & iOS)
        run: |
          echo "Decoding Firebase Android configuration..."
          mkdir -p omnihub/androidApp
          echo "${{ secrets.FIREBASE_ANDROID_BASE64 }}" | base64 --decode > omnihub/androidApp/google-services.json

          PACKAGE_NAME="io.lackstudio.omnihub"
          DEBUG_PACKAGE_NAME="${PACKAGE_NAME}.dev"
          if ! grep -q "$DEBUG_PACKAGE_NAME" omnihub/androidApp/google-services.json; then
            echo "Patching google-services.json to include ${DEBUG_PACKAGE_NAME}..."
            if command -v jq &> /dev/null; then
              jq --arg prod "$PACKAGE_NAME" --arg dev "$DEBUG_PACKAGE_NAME" \
                '.client += [.client[] | select(.client_info.android_client_info.package_name == $prod) | .client_info.android_client_info.package_name = $dev]' \
                omnihub/androidApp/google-services.json > omnihub/androidApp/google-services.json.tmp && \
                mv omnihub/androidApp/google-services.json.tmp omnihub/androidApp/google-services.json
            else
              sed -i '' "s/\"package_name\": \"$PACKAGE_NAME\"/\"package_name\": \"$DEBUG_PACKAGE_NAME\"/g" omnihub/androidApp/google-services.json
            fi
          fi

          echo "Decoding Firebase iOS configuration..."
          mkdir -p omnihub/iosApp/iosApp
          echo "${{ secrets.FIREBASE_IOS_BASE64 }}" | base64 --decode > omnihub/iosApp/iosApp/GoogleService-Info.plist

      - name: Create Dynamic Secrets XConfig File
        working-directory: './omnihub/iosApp/Configuration'
        run: |
          XCONFIG_FILENAME="GoogleKeys.xcconfig"
          PLIST_PATH="../iosApp/GoogleService-Info.plist"
          echo "Extracting keys from ${PLIST_PATH} to generate ${XCONFIG_FILENAME}..."

          if [ -f "$PLIST_PATH" ]; then
            CLIENT_ID=$(plutil -extract CLIENT_ID raw "$PLIST_PATH" 2>/dev/null || echo "")
            REVERSED_CLIENT_ID=$(plutil -extract REVERSED_CLIENT_ID raw "$PLIST_PATH" 2>/dev/null || echo "")
          fi

          CLIENT_ID="${CLIENT_ID:-${{ secrets.GOOGLE_CLIENT_ID }}}"
          REVERSED_CLIENT_ID="${REVERSED_CLIENT_ID:-${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}}"

          echo "GOOGLE_CLIENT_ID=${CLIENT_ID}" > "${XCONFIG_FILENAME}"
          echo "REVERSED_CLIENT_ID=${REVERSED_CLIENT_ID}" >> "${XCONFIG_FILENAME}"

      # List simulators
      - name: List available simulators
        run: |
          echo "=== RUNTIMES ==="
          xcrun simctl list runtimes
          echo "=== DEVICES ==="
          xcrun simctl list devices

      # Automatically find an available simulator (prioritize iPhone / Booted / Available)
      - name: Select an available simulator
        id: find-sim
        run: |
          set -e

          SIM=$(xcrun simctl list devices | \
            grep -E "iPhone" | \
            grep -v unavailable | \
            grep -v "(Booted)" | \
            sed -nE 's/.*\(([0-9A-F-]{36})\).*/\1/p' | \
            head -n 1)

          if [ -z "$SIM" ]; then
            echo "❌ No available iPhone simulators found"
            exit 1
          fi

          echo "✅ Selected Simulator: $SIM"
          NAME=$(xcrun simctl list devices | grep "$SIM" | head -n 1)
          echo "✅ Selected Simulator: $NAME ($SIM)"
          echo "SIM_UUID=$SIM" >> $GITHUB_ENV

      # Gradle Build & Pre-generate Synthetic SPM Linkage Package
      - name: Gradle Build & Integrate SwiftPM Package
        env:
          FORCE_COMPOSITE_BUILD: "true"
          XCODEPROJ_PATH: iosApp/iosApp.xcodeproj
        run: |
          unset ANDROID_PREFS_ROOT
          export ANDROID_USER_HOME="$HOME/.android"
          cd omnihub
          ./gradlew assembleDebug :shared:integrateLinkagePackage || true

          echo "Pre-generating synthetic SPM linkage project..."
          ACTION=build TARGET_BUILD_DIR=/tmp BUILT_PRODUCTS_DIR=/tmp CONFIGURATION=Debug SDK_NAME=iphonesimulator ARCHS=arm64 EXPANDED_CODE_SIGN_IDENTITY=- \
          ./gradlew :shared:generateSyntheticLinkageSwiftPMImportProjectForEmbedAndSignLinkage || true

          ACTION=build TARGET_BUILD_DIR=/tmp BUILT_PRODUCTS_DIR=/tmp CONFIGURATION=Debug SDK_NAME=iphonesimulator ARCHS=arm64 EXPANDED_CODE_SIGN_IDENTITY=- \
          ./gradlew :shared:generateSyntheticLinkageSwiftPMImportProjectForEmbedAndSignLinkage

          if [ -d "shared/iosApp/KotlinMultiplatformLinkedPackage" ] && [ ! -d "iosApp/KotlinMultiplatformLinkedPackage" ]; then
            echo "Syncing shared/iosApp/KotlinMultiplatformLinkedPackage to iosApp/..."
            cp -R shared/iosApp/KotlinMultiplatformLinkedPackage iosApp/
          fi

      # Execute Xcode Build
      - name: Xcode Build (clean build .xcodeproj)
        working-directory: './omnihub/iosApp'
        run: |
          echo "Building iOS target via .xcodeproj..."
          xcodebuild clean build \
              -project "iosApp.xcodeproj" \
              -scheme "iosApp" \
              -configuration "Debug" \
              -sdk iphonesimulator \
              -destination "id=${{ env.SIM_UUID }}" \
              ENABLE_PREVIEWS=NO \
              CODE_SIGNING_ALLOWED=NO 

      - name: Check (Test & Lint)
        continue-on-error: false
        env:
          FORCE_COMPOSITE_BUILD: "true"
        run: |
          unset ANDROID_PREFS_ROOT
          export ANDROID_USER_HOME="$HOME/.android"
          cd omnihub
          ./gradlew check \
          -Pskip.native.tests=true \
          ${{ inputs.run_with_stacktrace && '--stacktrace' || '' }} \
          ${{ inputs.run_with_info && '--info' || '' }} \
          ${{ inputs.run_with_debug && '--debug' || '' }}

      # Critical step: Upload test results XML for use by the next Job
      - name: Upload Test Results XML
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-results-xml
          path: '**/build/test-results/**/*.xml'
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Test Report HTML
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-html
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 5
          if-no-files-found: ignore

  # Job 2: Generate Dorny report on Linux
  report-test-results:
    name: Report Test Results
    runs-on: ubuntu-latest # Dorny must run in a Linux (Docker) environment
    needs: build-and-test
    permissions:
      checks: write      # Required permission
      pull-requests: write
      contents: read
    if: always()
    steps:
      - name: Install Git (for act environment)
        if: ${{ env.ACT }}
        run: |
          apt-get update && apt-get install -y git

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Test Results
        uses: actions/download-artifact@v8
        with:
          name: test-results-xml
          path: test-results

      - name: Dorny Test Reporter
        uses: dorny/test-reporter@v3
        if: (success() || failure()) && !env.ACT
        with:
          name: JUnit Test Report # Name displayed in the left menu
          path: 'test-results/**/*.xml'
          reporter: java-junit
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}
