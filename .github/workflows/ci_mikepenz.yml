name: Continuous Integration (mikepenz)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md' # ignore all of .md files
      - '.gitignore'
      - 'LICENSE'
      - 'run_act_safe.sh'
      - '.releaserc.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/deploy_auth_web.yml'
      - 'site/**'
      - 'docs/**'
      - 'renovate.json'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md' # ignore all of .md files
      - '.gitignore'
      - 'LICENSE'
      - 'run_act_safe.sh'
      - '.releaserc.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/deploy_auth_web.yml'
      - 'site/**'
      - 'docs/**'
      - 'renovate.json'

  workflow_dispatch:
    inputs:
      run_with_stacktrace:
        description: 'Run Gradle with --stacktrace'
        type: boolean
        required: false
        default: false
      run_with_info:
        description: 'Run Gradle with --info'
        type: boolean
        required: false
        default: false
      run_with_debug:
        description: 'Run Gradle with --debug'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test
    runs-on: macos-latest
    env:
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
      # Required by omnifeed-kmp due to the composite build configuration.
      # Please remove this if we switch to using binary dependencies (e.g., GitHub Packages),
      # unless OmniHub itself requires Google Services (Firebase).
      GOOGLE_SERVICES_WEB_CLIENT_ID: ${{ secrets.GOOGLE_SERVICES_WEB_CLIENT_ID }}

    # Permissions required for Mike Penz action to publish reports
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      # Checkout OmniHub (App) to subdirectory 'omnihub'
      - name: Checkout OmniHub (App)
        uses: actions/checkout@v6
        with:
          path: omnihub

      # Checkout OmniFeed (Lib) to subdirectory 'omnifeed-kmp'
      - name: Checkout OmniFeed (Lib)
        uses: actions/checkout@v6
        with:
          repository: lackary/omnifeed-kmp
          path: omnifeed-kmp

      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Specify execution inside omnihub directory
      - name: Grant execute permission for gradlew
        run: chmod +x omnihub/gradlew

      # Setup Environment and Run Initialization Scripts
      - name: Setup iOS Environment (Dummy Framework & Pods)
        run: |
          if [ -n "$ACT" ]; then
            echo "Running in 'act' environment."
            if ! command -v pod &> /dev/null; then
              echo "CocoaPods not found. Installing via Homebrew..."
              brew install cocoapods
            else
              echo "CocoaPods is already installed."
            fi
          else
            echo "Running in CI environment. Installing CocoaPods..."
            gem install cocoapods
          fi

          echo "Running Setup Script..."
          cd omnihub
          chmod +x setup_ios.sh
          ./setup_ios.sh


      # List simulators
      - name: List available simulators
        run: |
          echo "=== RUNTIMES ==="
          xcrun simctl list runtimes
          echo "=== DEVICES ==="
          xcrun simctl list devices

      # Automatically find an available simulator (prioritize iPhone / Booted / Available)
      - name: Select an available simulator
        id: find-sim
        run: |
          set -e

          SIM=$(xcrun simctl list devices | \
            grep -E "iPhone" | \
            grep -v unavailable | \
            grep -v "(Booted)" | \
            sed -nE 's/.*\(([0-9A-F-]{36})\).*/\1/p' | \
            head -n 1)

          if [ -z "$SIM" ]; then
            echo "❌ No available iPhone simulators found"
            exit 1
          fi

          echo "✅ Selected Simulator: $SIM"
          NAME=$(xcrun simctl list devices | grep "$SIM" | head -n 1)
          echo "✅ Selected Simulator: $NAME ($SIM)"
          echo "SIM_UUID=$SIM" >> $GITHUB_ENV

      # Execute Xcode Build
      - name: Xcode Build (clean build .xcworkspace)
        working-directory: './omnihub/iosApp'
        run: |
          echo "Building iOS target via .xcworkspace..."
          xcodebuild clean build \
              -workspace "iosApp.xcworkspace" \
              -scheme "iosApp" \
              -configuration "Debug" \
              -sdk iphonesimulator \
              -destination "id=${{ env.SIM_UUID }}" \
              ENABLE_PREVIEWS=NO \
              CODE_SIGNING_ALLOWED=NO 

      # Compile
      - name: Assemble with Gradle (Compile)
        # Set environment variable FORCE_COMPOSITE_BUILD
        env:
          FORCE_COMPOSITE_BUILD: "true"
        # Enter omnihub directory to execute Gradle
        run: |
          echo env.
          cd omnihub
          ./gradlew assembleDebug \
          ${{ inputs.run_with_stacktrace && '--stacktrace' || '' }} \
          ${{ inputs.run_with_info && '--info' || '' }} \
          ${{ inputs.run_with_debug && '--debug' || '' }}

      # Run Checks and Tests
      - name: Check with Gradle (Test & Lint)
        continue-on-error: false
        env:
          FORCE_COMPOSITE_BUILD: "true"
        # Enter omnihub directory to execute Gradle
        run: |
          cd omnihub
          ./gradlew check \
          ${{ inputs.run_with_stacktrace && '--stacktrace' || '' }} \
          ${{ inputs.run_with_info && '--info' || '' }} \
          ${{ inputs.run_with_debug && '--debug' || '' }}

      # Publish JUnit Test Report (GitHub Summary + PR Annotations)
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # Run even if tests fail
        with:
          report_paths: 'omnihub/**/build/test-results/**/*.xml' # Supports multi-module paths
          check_name: 'JUnit Test Report'
          detailed_summary: true # Show detailed table
          include_passed: true   # Include passed tests (similar visual effect to Dorny)
          annotate_only: ${{ env.ACT == 'true' }} # Enable "annotate only" mode when running locally via Act to skip Checks API calls

      # Upload HTML Report (For manual download and inspection)
      - name: Upload Test Report HTML
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-html
          path: |
            omnihub/**/build/reports/tests/
            omnihub/**/build/reports/lint-results-*.html
          retention-days: 5
