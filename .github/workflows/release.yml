name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write # Write permission is required to create Releases and Tags
  issues: write   # If semantic-release needs to comment on Issues (optional)
  pull-requests: write # If semantic-release needs to comment on PRs (optional)

jobs:
  release:
    name: Semantic Release
    runs-on: macos-latest
    env:
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      GOOGLE_SERVICES_WEB_CLIENT_ID: ${{ secrets.GOOGLE_SERVICES_WEB_CLIENT_ID }}
      FIREBASE_WEB_BASE64: ${{ secrets.FIREBASE_WEB_BASE64 }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_REGION: ${{ secrets.FIREBASE_REGION }}
      FIREBASE_EXT_CUSTOM_AUTH_PATH: ${{ secrets.FIREBASE_EXT_CUSTOM_AUTH_PATH }}
      AUTH_ENCRYPTION_SALT: ${{ secrets.AUTH_ENCRYPTION_SALT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}

    steps:
      - name: Checkout OmniHub (App)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Must fetch full git history so semantic-release can analyze commits
          persist-credentials: false # Avoid using checkout's token; use semantic-release's token instead

      - name: Checkout OmniFeed (Lib)
        uses: actions/checkout@v7
        with:
          repository: lackary/omnifeed-kmp
          path: omnifeed-kmp

      - name: Setup Environment
        uses: ./.github/actions/setup-env
        with:
          firebase-android-base64: ${{ secrets.FIREBASE_ANDROID_BASE64 }}
          firebase-ios-base64: ${{ secrets.FIREBASE_IOS_BASE64 }}
          google-client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google-reversed-client-id: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24 # Specify the core version of semantic-release (recommended to lock)
          dry_run: ${{ env.ACT == 'true' }}
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            @semantic-release/git
            @semantic-release/changelog
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
