<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniHub Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Material 3 Dark Theme Tokens (Green/Neutral vibe for Success) */
            --md-sys-color-background: #111411;
            --md-sys-color-surface-container: #282B28; /* Dark grayish green container */
            --md-sys-color-primary: #8CD69A; /* M3 soft green */
            --md-sys-color-on-primary: #003914;
            --md-sys-color-on-surface: #E2E3DE;
            --md-sys-color-on-surface-variant: #C2C8C1;
            --md-sys-color-outline: #8C938C;
        }

        body {
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-surface);
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        /* M3 Card Style */
        .card {
            background-color: var(--md-sys-color-surface-container);
            border-radius: 28px; /* M3 Large Corner */
            padding: 48px 32px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 4px 8px 3px rgba(0, 0, 0, 0.15),
                        0 1px 3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: fadeIn 0.6s cubic-bezier(0.2, 0.0, 0, 1.0);
        }

        /* Success Icon */
        .icon-container {
            width: 80px;
            height: 80px;
            background-color: rgba(140, 214, 154, 0.1); /* Primary with opacity */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--md-sys-color-primary);
            margin-bottom: 8px;
        }

        svg {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }

        /* Typography */
        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 500; /* M3 Headline Small */
            line-height: 32px;
            color: var(--md-sys-color-on-surface);
        }

        p {
            margin: 0;
            font-size: 16px;
            line-height: 24px; /* M3 Body Medium */
            letter-spacing: 0.25px;
            color: var(--md-sys-color-on-surface-variant);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-container">
            <svg viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
        </div>

        <div>
            <h1>Login Successful</h1>
        </div>

        <p>Authentication is complete.<br>You can now safely close this tab and return to the <b>OmniHub</b> app.</p>
    </div>

    <script>
        // Use JavaScript to trigger the custom protocol, which prompts the macOS "Open App" dialog.
        // We add a small delay to ensure the success message is visible first.
        setTimeout(function() {
            window.location.href = "omnihub://auth/callback";
        }, 500);
    </script>
</body>
</html>
