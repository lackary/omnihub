panpf-sketch-blurhash = { module = "io.github.panpf.sketch4:sketch-blurhash", version.ref = "sketch" }
gitlive-firebase-auth = { group = "dev.gitlive", name = "firebase-auth", version.ref = "gitliveFirebase" }
mirzemehdi-kmpauth-google = { group = "io.github.mirzemehdi", name = "kmpauth-google", version.ref = "mirzemehdiKmpAuth"}
