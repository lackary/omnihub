google-gms-play-service-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "googleGms" }
google-googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }

# Self
omnifeed = { module = "io.lackstudio.omnifeed:omnifeed", version.ref = "omnifeed" }
omnifeed-core = { module = "io.lackstudio.omnifeed:omnifeed-core", version.ref = "omnifeed" }
